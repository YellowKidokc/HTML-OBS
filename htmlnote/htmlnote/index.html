<!DOCTYPE html>
<html lang="en" data-theme="dark" data-density="comfortable">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTMLNote</title>
<link rel="stylesheet" href="/design-system.css">
<style>
  /* ─── Reset ─── */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
  }

  /* ─── Sidebar ─── */
  #sidebar {
    width: 280px;
    min-width: 220px;
    max-width: 480px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    position: relative;
  }

  #resize-handle {
    position: absolute;
    right: -2px;
    top: 0;
    bottom: 0;
    width: 5px;
    cursor: col-resize;
    z-index: 10;
  }
  #resize-handle:hover,
  #resize-handle.dragging {
    background: var(--interactive-accent);
    opacity: 0.3;
  }

  /* Header */
  #sidebar-header {
    padding: 14px 14px 0;
    flex-shrink: 0;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand-name {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  .brand-ver {
    font-size: 10px;
    color: var(--text-faint);
    font-family: var(--font-mono);
  }

  .root-path {
    font-size: 11px;
    color: var(--text-faint);
    font-family: var(--font-mono);
    margin-top: 4px;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: var(--radius-s);
    word-break: break-all;
    line-height: 1.4;
  }
  .root-path:hover { background: var(--bg-hover); }

  /* Sidebar tabs */
  .sidebar-tabs {
    display: flex;
    gap: 0;
    margin-top: 10px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-tab {
    flex: 1;
    padding: 7px 0;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-faint);
    font-size: 12px;
    font-weight: 400;
    cursor: pointer;
    font-family: var(--font-sans);
    transition: all var(--duration-short) var(--ease-standard);
  }
  .sidebar-tab:hover { color: var(--text-muted); }
  .sidebar-tab.active {
    color: var(--text);
    font-weight: 600;
    border-bottom-color: var(--interactive-accent);
  }
  .sidebar-tab-icon {
    flex: 0;
    padding: 7px 14px;
  }

  /* Filter pills */
  #filter-bar {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .filter-pills {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .pill {
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-faint);
    cursor: pointer;
    font-family: var(--font-sans);
    transition: all var(--duration-short) var(--ease-standard);
    white-space: nowrap;
  }
  .pill:hover { border-color: var(--text-faint); color: var(--text-muted); }
  .pill.active { border-color: var(--interactive-accent); color: var(--interactive-accent); background: hsl(var(--accent-h) var(--accent-s) var(--accent-l) / 0.08); }

  .pill-count {
    opacity: 0.5;
    margin-left: 2px;
    font-size: 10px;
  }

  /* Search */
  #search-box {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .search-input {
    width: 100%;
    padding: 7px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-m);
    color: var(--text);
    font-size: 13px;
    outline: none;
    font-family: var(--font-sans);
  }
  .search-input:focus { border-color: var(--interactive-accent); }
  .search-input::placeholder { color: var(--text-faint); }

  /* Scrollable tree */
  #tree-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 4px 0;
  }
  #tree-scroll::-webkit-scrollbar { width: 5px; }
  #tree-scroll::-webkit-scrollbar-track { background: transparent; }
  #tree-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Tree items */
  .t-folder { }
  .t-folder > .t-children { display: none; }
  .t-folder.open > .t-children { display: block; }

  .t-item {
    display: flex;
    align-items: center;
    padding: 0 10px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    user-select: none;
    min-height: var(--nav-item-height);
    transition: background var(--duration-short) var(--ease-standard);
    border-left: 2px solid transparent;
  }
  .t-item:hover { background: var(--bg-hover); }
  .t-item.active {
    background: var(--bg-active);
    color: var(--text);
    border-left-color: var(--interactive-accent);
  }

  .t-arrow {
    width: 14px;
    font-size: 9px;
    color: var(--text-faint);
    transition: transform var(--duration-short) var(--ease-standard);
    flex-shrink: 0;
    text-align: center;
  }
  .t-folder.open > .t-item .t-arrow { transform: rotate(90deg); }

  .t-icon {
    width: 16px;
    margin-right: 6px;
    flex-shrink: 0;
    font-size: 13px;
    text-align: center;
  }

  .t-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-right: 8px;
    flex-shrink: 0;
  }

  .t-name {
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .t-badge {
    font-size: 9px;
    padding: 1px 6px;
    border-radius: 8px;
    margin-left: 6px;
    flex-shrink: 0;
    background: hsl(var(--accent-h) var(--accent-s) var(--accent-l) / 0.15);
    color: var(--interactive-accent);
  }

  .t-series-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    margin-left: 6px;
    flex-shrink: 0;
  }

  /* Series tab cards */
  .series-card {
    margin: 4px 10px;
    padding: 10px 12px;
    border-radius: var(--radius-l);
    cursor: pointer;
    transition: background var(--duration-short) var(--ease-standard);
  }
  .series-card:hover { background: var(--bg-hover); }

  .series-name {
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .series-meta {
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 3px;
    padding-left: 22px;
  }

  .series-files-list {
    margin-top: 6px;
    padding-left: 22px;
  }

  .series-file-item {
    font-size: 12px;
    color: var(--text-muted);
    padding: 3px 0;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .series-file-item:hover { color: var(--text); }
  .series-file-item.active { color: var(--interactive-accent); }

  .series-order {
    font-size: 10px;
    font-family: var(--font-mono);
    color: var(--text-faint);
    width: 16px;
    text-align: right;
  }

  .new-series-btn {
    margin: 8px 10px;
    padding: 8px;
    border: 1px dashed var(--border);
    border-radius: var(--radius-l);
    color: var(--text-faint);
    font-size: 12px;
    text-align: center;
    cursor: pointer;
    background: transparent;
    font-family: var(--font-sans);
    width: calc(100% - 20px);
  }
  .new-series-btn:hover { border-color: var(--interactive-accent); color: var(--interactive-accent); }

  /* Status bar */
  #status-bar {
    padding: 6px 12px;
    border-top: 1px solid var(--border);
    font-size: 10px;
    color: var(--text-faint);
    flex-shrink: 0;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .stat { display: flex; align-items: center; gap: 3px; }
  .stat-dot { width: 6px; height: 6px; border-radius: 50%; }

  /* ─── Category colors ─── */
  .c-html { background: #6d9cff; }
  .c-markdown { background: #a78bfa; }
  .c-video { background: #f97316; }
  .c-audio { background: #22c55e; }
  .c-image { background: #ec4899; }
  .c-code { background: #facc15; }
  .c-pdf { background: #ef4444; }
  .c-other { background: var(--text-faint); }

  /* ─── Main panel ─── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }

  /* Series nav bar */
  #series-nav {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 5px 16px;
    font-size: 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #series-nav.show { display: flex; }

  .sn-label {
    font-weight: 700;
    letter-spacing: 0.04em;
    font-size: 10px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .sn-pos { color: var(--text-faint); font-size: 11px; }

  .sn-btns { margin-left: auto; display: flex; gap: 4px; }

  .sn-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius-s);
    padding: 2px 10px;
    font-size: 11px;
    cursor: pointer;
    font-family: var(--font-sans);
    color: var(--text-muted);
    transition: all var(--duration-short);
  }
  .sn-btn:hover:not(:disabled) { border-color: var(--text-muted); color: var(--text); }
  .sn-btn:disabled { opacity: 0.25; cursor: default; }

  /* File header */
  #viewer-header {
    display: none;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    background: var(--background-elevated);
  }
  #viewer-header.show { display: flex; }

  .vh-path {
    font-size: 12px;
    color: var(--text-faint);
    font-family: var(--font-mono);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .vh-btn {
    padding: 4px 10px;
    background: var(--bg-hover);
    border: 1px solid var(--border);
    border-radius: var(--radius-s);
    color: var(--text-muted);
    font-size: 11px;
    cursor: pointer;
    font-family: var(--font-sans);
    transition: all var(--duration-short);
  }
  .vh-btn:hover { background: var(--bg-active); color: var(--text); }

  .vh-select {
    padding: 3px 8px;
    background: var(--bg-sidebar);
    border: 1px solid var(--border);
    border-radius: var(--radius-s);
    color: var(--text);
    font-size: 12px;
    font-family: var(--font-mono);
  }

  /* Content areas */
  #viewer-frame {
    flex: 1;
    border: none;
    background: white;
    display: none;
  }

  #media-viewer {
    flex: 1;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    overflow: auto;
  }
  #media-viewer video, #media-viewer audio { max-width: 100%; max-height: 80vh; border-radius: var(--radius-s); }
  #media-viewer img { max-width: 100%; max-height: 80vh; border-radius: var(--radius-s); }

  #markdown-viewer {
    flex: 1;
    display: none;
    padding: 40px 48px;
    overflow-y: auto;
    line-height: 1.7;
    font-size: 15px;
    max-width: 800px;
  }
  #markdown-viewer h1 { font-size: 26px; color: var(--text); margin: 20px 0 10px; }
  #markdown-viewer h2 { font-size: 21px; color: var(--text); margin: 18px 0 8px; }
  #markdown-viewer h3 { font-size: 17px; color: var(--text); margin: 14px 0 6px; }
  #markdown-viewer code { background: var(--bg-hover); padding: 1px 5px; border-radius: 3px; font-family: var(--font-mono); font-size: 13px; }

  /* Empty state */
  #empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .empty-icon {
    width: 72px;
    height: 72px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    border: 1px solid var(--border);
    color: var(--text-faint);
    background: var(--bg-sidebar);
  }

  .empty-title { font-size: 15px; color: var(--text-muted); }
  .empty-sub { font-size: 12px; color: var(--text-faint); max-width: 300px; text-align: center; line-height: 1.5; }

  /* Context menu */
  #ctx-menu {
    display: none;
    position: fixed;
    background: var(--background-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-l);
    padding: 4px 0;
    z-index: 200;
    min-width: 200px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  #ctx-menu.show { display: block; }

  .ctx-item {
    padding: 7px 14px;
    font-size: 12px;
    cursor: pointer;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ctx-item:hover { background: var(--bg-hover); }
  .ctx-item.danger { color: #ef4444; }
  .ctx-divider { height: 1px; background: var(--border); margin: 4px 10px; }

  .ctx-label { font-size: 10px; color: var(--text-faint); padding: 4px 14px 2px; text-transform: uppercase; letter-spacing: 0.06em; }

  /* Rename modal */
  #rename-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 300;
    align-items: center;
    justify-content: center;
  }
  #rename-modal.show { display: flex; }

  .modal-box {
    background: var(--background-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-l);
    padding: 20px;
    width: 400px;
  }

  .modal-box h3 { font-size: 14px; color: var(--text); margin-bottom: 12px; }

  .modal-input {
    width: 100%;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-s);
    color: var(--text);
    font-size: 13px;
    font-family: var(--font-mono);
    outline: none;
  }
  .modal-input:focus { border-color: var(--interactive-accent); }

  .modal-actions { margin-top: 12px; display: flex; justify-content: flex-end; gap: 8px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div id="sidebar">
  <!-- Header -->
  <div id="sidebar-header">
    <div class="brand-row">
      <span class="brand-name">HTMLNote</span>
      <span class="brand-ver">v0.3</span>
      <div class="appearance-controls" style="margin-left:auto">
        <button class="vh-btn appearance-btn" data-theme-choice="light" title="Light">☀</button>
        <button class="vh-btn appearance-btn" data-theme-choice="dark" title="Dark">◐</button>
      </div>
    </div>
    <div class="root-path" id="root-path" title="Click to change root">loading…</div>

    <div class="sidebar-tabs">
      <button class="sidebar-tab active" data-tab="files">Files</button>
      <button class="sidebar-tab" data-tab="series">Series</button>
      <button class="sidebar-tab sidebar-tab-icon" data-tab="search">⌕</button>
    </div>
  </div>

  <!-- Files tab: filter pills -->
  <div id="filter-bar">
    <div class="filter-pills" id="filter-pills"></div>
  </div>

  <!-- Search tab: input -->
  <div id="search-box" style="display:none">
    <input class="search-input" id="search-input" placeholder="Search files…" autocomplete="off">
  </div>

  <!-- Content -->
  <div id="tree-scroll"></div>

  <!-- Status -->
  <div id="status-bar"></div>

  <div id="resize-handle"></div>
</div>

<div id="main">
  <!-- Series nav -->
  <div id="series-nav">
    <span class="sn-label" id="sn-label"></span>
    <span style="color:var(--text-faint)">·</span>
    <span class="sn-pos" id="sn-pos"></span>
    <div class="sn-btns">
      <button class="sn-btn" id="sn-home" title="Series home">⌂</button>
      <button class="sn-btn" id="sn-prev">← Prev</button>
      <button class="sn-btn" id="sn-next">Next →</button>
    </div>
  </div>

  <!-- File header -->
  <div id="viewer-header">
    <span class="vh-path" id="current-path"></span>
    <select class="vh-select" id="version-select" style="display:none"></select>
    <button class="vh-btn" id="btn-rename">Rename</button>
    <button class="vh-btn" id="btn-refresh">↻</button>
  </div>

  <div id="empty-state">
    <div class="empty-icon">⟨/⟩</div>
    <div class="empty-title">Select a file to preview</div>
    <div class="empty-sub">HTML renders live. Markdown, video, audio, images, and code all supported. Right-click files to manage series.</div>
  </div>

  <iframe id="viewer-frame" sandbox="allow-scripts allow-same-origin"></iframe>
  <div id="media-viewer"></div>
  <div id="markdown-viewer"></div>
</div>

<!-- Context menu -->
<div id="ctx-menu">
  <div class="ctx-item" data-action="open">Open</div>
  <div class="ctx-divider"></div>
  <div class="ctx-label">Series</div>
  <div class="ctx-item" data-action="add-series">Add to series…</div>
  <div class="ctx-item" data-action="remove-series">Remove from series</div>
  <div class="ctx-item" data-action="set-home">Set as series home</div>
  <div class="ctx-divider"></div>
  <div class="ctx-item" data-action="rename">Rename</div>
  <div class="ctx-item" data-action="copypath">Copy path</div>
</div>

<!-- Rename modal -->
<div id="rename-modal">
  <div class="modal-box">
    <h3>Rename file</h3>
    <input class="modal-input" id="rename-input">
    <div class="modal-actions">
      <button class="vh-btn" id="rename-cancel">Cancel</button>
      <button class="vh-btn" id="rename-confirm" style="background:hsl(var(--accent-h) var(--accent-s) var(--accent-l)/0.2);color:var(--interactive-accent);">Rename</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// HTMLNote v0.3 — Frontend
// Connects to existing server.js API at same origin
// ═══════════════════════════════════════════════════════════

const API = '';
const CAT_COLORS = { html:'#6d9cff', markdown:'#a78bfa', video:'#f97316', audio:'#22c55e', image:'#ec4899', code:'#facc15', pdf:'#ef4444', other:'#71717a' };
const CATEGORIES = ['all','html','markdown','video','audio','image','code'];

let treeData = [], versionMap = {}, allFiles = [], activeFile = null, contextTarget = null;
let currentTab = 'files', currentFilter = 'all';

// ─── Series persistence (localStorage for now, later _htmlnote.json sidecar) ───
let seriesData = JSON.parse(localStorage.getItem('htmlnote-series') || '{}');
// seriesData = { "series-key": { name, color, icon, home, files: [{path, order}] } }

function saveSeries() { localStorage.setItem('htmlnote-series', JSON.stringify(seriesData)); }

function getFileSeries(path) {
  for (const [key, s] of Object.entries(seriesData)) {
    const entry = s.files?.find(f => f.path === path);
    if (entry) return { key, ...s, order: entry.order };
  }
  return null;
}

function getSeriesFiles(key) {
  const s = seriesData[key];
  if (!s || !s.files) return [];
  return s.files.sort((a, b) => (a.order || 0) - (b.order || 0));
}

// ─── Auto-detect series from folder structure ───
function autoDetectSeries(tree) {
  // Only auto-detect if user has no manual series yet
  if (Object.keys(seriesData).length > 0) return;

  function walk(nodes, parentFolder) {
    for (const n of nodes) {
      if (n.type === 'folder' && n.children) {
        const htmlFiles = n.children.filter(c => c.type === 'file' && c.category === 'html');
        if (htmlFiles.length >= 2) {
          const key = n.name.toLowerCase().replace(/\s+/g, '-');
          if (!seriesData[key]) {
            const colors = ['#c0392b','#d4a017','#3498db','#27ae60','#8e44ad','#e67e22'];
            const icons = ['◆','◇','●','▲','■','★'];
            const idx = Object.keys(seriesData).length;
            seriesData[key] = {
              name: n.title || n.name,
              color: colors[idx % colors.length],
              icon: icons[idx % icons.length],
              home: null,
              files: htmlFiles.map((f, i) => ({ path: f.path, order: i + 1 }))
            };
          }
        }
        walk(n.children, n.name);
      }
    }
  }
  walk(tree, '');
  if (Object.keys(seriesData).length > 0) saveSeries();
}

// ─── Load ───
async function loadTree() {
  const res = await fetch(`${API}/api/tree`);
  const data = await res.json();
  treeData = data.tree;
  versionMap = data.versions || {};
  document.getElementById('root-path').textContent = data.root;

  allFiles = [];
  flatCollect(treeData, allFiles);
  autoDetectSeries(treeData);

  renderFilterPills();
  render();
  renderStatus();
}

function flatCollect(nodes, out) {
  for (const n of nodes) {
    if (n.type === 'file') out.push(n);
    else if (n.children) flatCollect(n.children, out);
  }
}

// ─── Filter pills ───
function renderFilterPills() {
  const counts = {};
  for (const f of allFiles) counts[f.category] = (counts[f.category] || 0) + 1;

  const el = document.getElementById('filter-pills');
  el.innerHTML = CATEGORIES.map(c => {
    const label = c === 'all' ? 'All' : c.charAt(0).toUpperCase() + c.slice(1);
    const count = c === 'all' ? allFiles.length : (counts[c] || 0);
    const active = currentFilter === c ? ' active' : '';
    return `<button class="pill${active}" data-cat="${c}">${label}<span class="pill-count">${count}</span></button>`;
  }).join('');

  el.querySelectorAll('.pill').forEach(btn => {
    btn.addEventListener('click', () => { currentFilter = btn.dataset.cat; renderFilterPills(); render(); });
  });
}

// ─── Render dispatcher ───
function render() {
  const scroll = document.getElementById('tree-scroll');
  const searchBox = document.getElementById('search-box');
  const filterBar = document.getElementById('filter-bar');

  if (currentTab === 'files') {
    filterBar.style.display = '';
    searchBox.style.display = 'none';
    scroll.innerHTML = '';
    renderFileTree(scroll, treeData, 0);
  } else if (currentTab === 'series') {
    filterBar.style.display = 'none';
    searchBox.style.display = 'none';
    scroll.innerHTML = '';
    renderSeriesTab(scroll);
  } else if (currentTab === 'search') {
    filterBar.style.display = 'none';
    searchBox.style.display = '';
    scroll.innerHTML = '';
    const q = document.getElementById('search-input').value.toLowerCase();
    if (q) renderSearchResults(scroll, q);
  }
}

// ─── File tree ───
function renderFileTree(container, nodes, depth) {
  const search = currentTab === 'search' ? document.getElementById('search-input').value.toLowerCase() : '';

  for (const node of nodes) {
    if (node.type === 'folder') {
      if (!folderMatch(node, currentFilter, search)) continue;

      const wrapper = document.createElement('div');
      wrapper.className = 'tree-folder t-folder' + (depth < 1 ? ' open' : '');

      const item = document.createElement('div');
      item.className = 't-item';
      item.style.paddingLeft = (10 + depth * 16) + 'px';
      item.innerHTML = `<span class="t-arrow">▶</span><span class="t-icon">📁</span><span class="t-name">${esc(node.title || node.name)}</span>`;
      item.addEventListener('click', () => wrapper.classList.toggle('open'));

      const children = document.createElement('div');
      children.className = 't-children';

      wrapper.appendChild(item);
      wrapper.appendChild(children);
      container.appendChild(wrapper);

      renderFileTree(children, node.children, depth + 1);
    } else {
      if (currentFilter !== 'all' && node.category !== currentFilter) continue;
      if (search && !node.name.toLowerCase().includes(search) && !(node.title||'').toLowerCase().includes(search)) continue;

      const item = document.createElement('div');
      item.className = 't-item' + (activeFile && activeFile.path === node.path ? ' active' : '');
      item.style.paddingLeft = (10 + depth * 16 + 14) + 'px';
      item.dataset.path = node.path;

      const series = getFileSeries(node.path);
      let extras = '';

      // Version badge
      const stem = versionKey(node);
      if (stem && versionMap[stem] && versionMap[stem].length > 1) {
        extras += `<span class="t-badge">${versionMap[stem].length}v</span>`;
      }

      // Series dot
      if (series) {
        extras += `<span class="t-series-dot" style="background:${series.color}" title="${series.name}"></span>`;
      }

      item.innerHTML = `<span class="t-dot c-${node.category}"></span><span class="t-name">${esc(node.title || node.name)}</span>${extras}`;

      item.addEventListener('click', () => openFile(node));
      item.addEventListener('contextmenu', (e) => { e.preventDefault(); showCtx(e, node); });

      container.appendChild(item);
    }
  }
}

function folderMatch(folder, filter, search) {
  for (const n of folder.children) {
    if (n.type === 'folder' && folderMatch(n, filter, search)) return true;
    if (n.type === 'file') {
      if (filter !== 'all' && n.category !== filter) continue;
      if (search && !n.name.toLowerCase().includes(search) && !(n.title||'').toLowerCase().includes(search)) continue;
      return true;
    }
  }
  return false;
}

function versionKey(node) {
  if (node.category !== 'html') return null;
  const dir = node.path.includes('/') ? node.path.substring(0, node.path.lastIndexOf('/')) : '';
  const base = node.name.replace(/\.(html|htm)$/i, '').replace(/[_\- ]*(v\d+|copy|backup|old|new|final|draft|rev\d*)$/i, '').toLowerCase().trim();
  return dir ? `${dir}/${base}` : base;
}

// ─── Series tab ───
function renderSeriesTab(container) {
  const keys = Object.keys(seriesData);
  if (keys.length === 0) {
    container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-faint);font-size:13px;">No series yet. Right-click files in the Files tab to create one, or folders with 2+ HTML files auto-detect.</div>';
    return;
  }

  for (const key of keys) {
    const s = seriesData[key];
    const files = getSeriesFiles(key);

    const card = document.createElement('div');
    card.className = 'series-card';
    card.style.border = `1px solid ${s.color}25`;

    let filesHtml = files.map(f => {
      const node = allFiles.find(af => af.path === f.path);
      const name = node ? (node.title || node.name) : f.path.split('/').pop();
      const isActive = activeFile && activeFile.path === f.path;
      return `<div class="series-file-item${isActive ? ' active' : ''}" data-path="${esc(f.path)}"><span class="series-order">${f.order}</span>${esc(name)}</div>`;
    }).join('');

    card.innerHTML = `
      <div class="series-name"><span style="color:${s.color};font-size:14px">${s.icon || '◆'}</span>${esc(s.name)}</div>
      <div class="series-meta">${files.length} article${files.length !== 1 ? 's' : ''}</div>
      <div class="series-files-list">${filesHtml}</div>`;

    card.querySelectorAll('.series-file-item').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const node = allFiles.find(f => f.path === el.dataset.path);
        if (node) openFile(node);
      });
    });

    container.appendChild(card);
  }

  const btn = document.createElement('button');
  btn.className = 'new-series-btn';
  btn.textContent = '+ Create new series';
  btn.addEventListener('click', () => {
    const name = prompt('Series name:');
    if (!name) return;
    const key = name.toLowerCase().replace(/\s+/g, '-');
    const colors = ['#c0392b','#d4a017','#3498db','#27ae60','#8e44ad','#e67e22'];
    const icons = ['◆','◇','●','▲','■','★'];
    const idx = Object.keys(seriesData).length;
    seriesData[key] = { name, color: colors[idx % colors.length], icon: icons[idx % icons.length], home: null, files: [] };
    saveSeries();
    render();
  });
  container.appendChild(btn);
}

// ─── Search results ───
function renderSearchResults(container, q) {
  const matches = allFiles.filter(f =>
    f.name.toLowerCase().includes(q) ||
    (f.title || '').toLowerCase().includes(q) ||
    f.path.toLowerCase().includes(q)
  );

  if (matches.length === 0) {
    container.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text-faint);font-size:13px">No files match "${esc(q)}"</div>`;
    return;
  }

  for (const node of matches) {
    const item = document.createElement('div');
    item.className = 't-item' + (activeFile && activeFile.path === node.path ? ' active' : '');
    item.style.paddingLeft = '14px';
    item.innerHTML = `<span class="t-dot c-${node.category}"></span><span class="t-name">${esc(node.title || node.name)}</span><span style="font-size:10px;color:var(--text-faint);margin-left:8px;font-family:var(--font-mono)">${esc(node.path)}</span>`;
    item.addEventListener('click', () => openFile(node));
    item.addEventListener('contextmenu', (e) => { e.preventDefault(); showCtx(e, node); });
    container.appendChild(item);
  }
}

// ─── Open file ───
function openFile(node) {
  activeFile = node;

  const frame = document.getElementById('viewer-frame');
  const media = document.getElementById('media-viewer');
  const mdView = document.getElementById('markdown-viewer');
  const empty = document.getElementById('empty-state');
  const header = document.getElementById('viewer-header');

  frame.style.display = 'none';
  media.style.display = 'none';
  mdView.style.display = 'none';
  empty.style.display = 'none';
  header.className = 'show';
  header.style.display = 'flex';

  document.getElementById('current-path').textContent = node.path;

  // Version select
  const vSelect = document.getElementById('version-select');
  const stem = versionKey(node);
  if (stem && versionMap[stem] && versionMap[stem].length > 1) {
    vSelect.style.display = '';
    vSelect.innerHTML = versionMap[stem].map(v =>
      `<option value="${esc(v.path)}"${v.path === node.path ? ' selected' : ''}>${esc(v.name)}</option>`
    ).join('');
  } else {
    vSelect.style.display = 'none';
  }

  // Series nav
  updateSeriesNav(node);

  // Load content
  const url = `${API}/api/file?path=${encodeURIComponent(node.path)}`;

  if (node.category === 'html') {
    frame.src = url;
    frame.style.display = 'block';
  } else if (node.category === 'video') {
    media.innerHTML = `<video controls src="${url}"></video>`;
    media.style.display = 'flex';
  } else if (node.category === 'audio') {
    media.innerHTML = `<p style="margin-bottom:16px;color:var(--text);font-size:16px">${esc(node.name)}</p><audio controls src="${url}"></audio>`;
    media.style.display = 'flex';
  } else if (node.category === 'image') {
    media.innerHTML = `<img src="${url}" alt="${esc(node.name)}">`;
    media.style.display = 'flex';
  } else if (node.category === 'markdown') {
    fetch(url).then(r => r.json()).then(data => { mdView.innerHTML = data.html; mdView.style.display = 'block'; });
  } else if (node.category === 'pdf') {
    frame.src = url;
    frame.style.display = 'block';
  } else {
    fetch(url).then(r => r.text()).then(text => {
      mdView.innerHTML = `<pre style="font-family:var(--font-mono);font-size:13px;white-space:pre-wrap;word-break:break-all;">${esc(text)}</pre>`;
      mdView.style.display = 'block';
    });
  }

  render(); // Re-render tree to show active highlight
}

// ─── Series nav bar ───
function updateSeriesNav(node) {
  const nav = document.getElementById('series-nav');
  const series = getFileSeries(node.path);

  if (!series) { nav.classList.remove('show'); return; }

  nav.classList.add('show');
  nav.style.borderBottomColor = series.color + '40';

  const files = getSeriesFiles(series.key);
  const idx = files.findIndex(f => f.path === node.path);
  const prev = idx > 0 ? files[idx - 1] : null;
  const next = idx < files.length - 1 ? files[idx + 1] : null;

  document.getElementById('sn-label').innerHTML = `<span style="color:${series.color}">${series.icon}</span> <span style="color:${series.color}">${esc(series.name)}</span>`;
  document.getElementById('sn-pos').textContent = `${idx + 1} of ${files.length}`;

  const prevBtn = document.getElementById('sn-prev');
  const nextBtn = document.getElementById('sn-next');
  const homeBtn = document.getElementById('sn-home');

  prevBtn.disabled = !prev;
  nextBtn.disabled = !next;
  homeBtn.style.display = series.home ? '' : 'none';

  prevBtn.onclick = () => { if (prev) { const n = allFiles.find(f => f.path === prev.path); if (n) openFile(n); } };
  nextBtn.onclick = () => { if (next) { const n = allFiles.find(f => f.path === next.path); if (n) openFile(n); } };
  homeBtn.onclick = () => { if (series.home) { const n = allFiles.find(f => f.path === series.home); if (n) openFile(n); } };
}

// ─── Status bar ───
function renderStatus() {
  const counts = {};
  for (const f of allFiles) counts[f.category] = (counts[f.category] || 0) + 1;
  document.getElementById('status-bar').innerHTML = Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .map(([cat, count]) => `<span class="stat"><span class="stat-dot c-${cat}"></span>${count} ${cat}</span>`)
    .join('');
}

// ─── Context menu ───
function showCtx(e, node) {
  contextTarget = node;
  const menu = document.getElementById('ctx-menu');
  menu.style.left = Math.min(e.clientX, window.innerWidth - 220) + 'px';
  menu.style.top = Math.min(e.clientY, window.innerHeight - 260) + 'px';
  menu.classList.add('show');

  const series = getFileSeries(node.path);
  menu.querySelector('[data-action="remove-series"]').style.display = series ? '' : 'none';
  menu.querySelector('[data-action="set-home"]').style.display = series ? '' : 'none';
}

document.addEventListener('click', () => document.getElementById('ctx-menu').classList.remove('show'));

document.querySelectorAll('#ctx-menu .ctx-item').forEach(item => {
  item.addEventListener('click', () => {
    if (!contextTarget) return;
    const action = item.dataset.action;

    if (action === 'open') openFile(contextTarget);
    if (action === 'rename') { activeFile = contextTarget; document.getElementById('btn-rename').click(); }
    if (action === 'copypath') navigator.clipboard.writeText(contextTarget.path);

    if (action === 'add-series') {
      const keys = Object.keys(seriesData);
      let choice;
      if (keys.length === 0) {
        const name = prompt('Create a new series — name:');
        if (!name) return;
        choice = name.toLowerCase().replace(/\s+/g, '-');
        const colors = ['#c0392b','#d4a017','#3498db','#27ae60','#8e44ad','#e67e22'];
        const icons = ['◆','◇','●','▲','■','★'];
        seriesData[choice] = { name, color: colors[0], icon: icons[0], home: null, files: [] };
      } else {
        const options = keys.map((k, i) => `${i + 1}. ${seriesData[k].name}`).join('\n');
        const input = prompt(`Add to which series?\n${options}\n\nOr type a new name:`);
        if (!input) return;
        const num = parseInt(input);
        if (num >= 1 && num <= keys.length) {
          choice = keys[num - 1];
        } else {
          choice = input.toLowerCase().replace(/\s+/g, '-');
          if (!seriesData[choice]) {
            const colors = ['#c0392b','#d4a017','#3498db','#27ae60','#8e44ad','#e67e22'];
            const icons = ['◆','◇','●','▲','■','★'];
            const idx = Object.keys(seriesData).length;
            seriesData[choice] = { name: input, color: colors[idx % colors.length], icon: icons[idx % icons.length], home: null, files: [] };
          }
        }
      }

      const s = seriesData[choice];
      if (!s.files.find(f => f.path === contextTarget.path)) {
        s.files.push({ path: contextTarget.path, order: s.files.length + 1 });
        saveSeries();
        render();
      }
    }

    if (action === 'remove-series') {
      const series = getFileSeries(contextTarget.path);
      if (series) {
        seriesData[series.key].files = seriesData[series.key].files.filter(f => f.path !== contextTarget.path);
        if (seriesData[series.key].files.length === 0) delete seriesData[series.key];
        saveSeries();
        render();
      }
    }

    if (action === 'set-home') {
      const series = getFileSeries(contextTarget.path);
      if (series) { seriesData[series.key].home = contextTarget.path; saveSeries(); }
    }
  });
});

// ─── Sidebar tabs ───
document.querySelectorAll('.sidebar-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    render();
    if (currentTab === 'search') setTimeout(() => document.getElementById('search-input').focus(), 50);
  });
});

// Search input
document.getElementById('search-input').addEventListener('input', render);

// ─── Version switch ───
document.getElementById('version-select').addEventListener('change', (e) => {
  const file = allFiles.find(f => f.path === e.target.value);
  if (file) openFile(file);
});

// ─── Rename ───
document.getElementById('btn-rename').addEventListener('click', () => {
  if (!activeFile) return;
  document.getElementById('rename-input').value = activeFile.name;
  document.getElementById('rename-modal').classList.add('show');
  setTimeout(() => document.getElementById('rename-input').focus(), 50);
});

document.getElementById('rename-cancel').addEventListener('click', () => document.getElementById('rename-modal').classList.remove('show'));

document.getElementById('rename-confirm').addEventListener('click', async () => {
  const newName = document.getElementById('rename-input').value.trim();
  if (!newName || !activeFile) return;
  const res = await fetch(`${API}/api/rename`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ oldPath: activeFile.path, newName }) });
  const data = await res.json();
  document.getElementById('rename-modal').classList.remove('show');
  if (data.ok) { await loadTree(); const file = allFiles.find(f => f.path === data.newPath); if (file) openFile(file); }
  else alert(data.error || 'Rename failed');
});

// ─── Refresh ───
document.getElementById('btn-refresh').addEventListener('click', loadTree);

// ─── Resize handle ───
const handle = document.getElementById('resize-handle');
const sidebar = document.getElementById('sidebar');
handle.addEventListener('mousedown', (e) => {
  e.preventDefault();
  handle.classList.add('dragging');
  const startX = e.clientX, startW = sidebar.offsetWidth;
  const onMove = (ev) => sidebar.style.width = Math.max(220, Math.min(480, startW + ev.clientX - startX)) + 'px';
  const onUp = () => { handle.classList.remove('dragging'); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});

// ─── Keyboard ───
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.getElementById('rename-modal').classList.remove('show');
    document.getElementById('ctx-menu').classList.remove('show');
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
    e.preventDefault();
    document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
    document.querySelector('[data-tab="search"]').classList.add('active');
    currentTab = 'search';
    render();
    setTimeout(() => document.getElementById('search-input').focus(), 50);
  }
});

// ─── Theme ───
const savedTheme = localStorage.getItem('htmlnote-theme') || 'dark';
document.documentElement.dataset.theme = savedTheme;

document.querySelectorAll('[data-theme-choice]').forEach(btn => {
  btn.setAttribute('aria-pressed', String(btn.dataset.themeChoice === savedTheme));
  btn.addEventListener('click', () => {
    const theme = btn.dataset.themeChoice;
    document.documentElement.dataset.theme = theme;
    localStorage.setItem('htmlnote-theme', theme);
    document.querySelectorAll('[data-theme-choice]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeChoice === theme)));
  });
});

// ─── Helpers ───
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ─── Init ───
loadTree();
</script>
</body>
</html>
